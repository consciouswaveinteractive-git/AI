<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MultiVibe — đăng nhập thử</title>
<style>body{font:16px system-ui;background:#f4f6f8;color:#18212b;max-width:680px;margin:60px auto;padding:24px}section{background:white;padding:28px;border-radius:12px;margin:18px 0}input,button,a{font:inherit}input{padding:10px;box-sizing:border-box;width:100%;margin:8px 0}button{padding:10px 18px;cursor:pointer}#message{white-space:pre-wrap}a{display:block;margin:15px 0}</style>
<h1>Đăng nhập MultiVibe thử nghiệm</h1><p>Chỉ thêm tài khoản. Chưa kết nối hoặc thay cấu hình Codex hiện tại.</p>
<section id="locked"><form id="unlock"><label>Admin token local<input id="token" type="password" autocomplete="off" required></label><button>Mở trang quản lý</button></form></section>
<section id="accounts" hidden><h2>Tài khoản</h2><ul id="list"></ul><form id="add"><label>Email tài khoản OpenAI<input id="email" type="email" required autocomplete="email"></label><button>Tạo liên kết đăng nhập</button></form><a id="authorize" hidden target="_blank" rel="noopener noreferrer">Mở trang đăng nhập OpenAI</a><p>Mật khẩu OpenAI chỉ nhập trên auth.openai.com.</p><button id="refresh">Làm mới danh sách</button></section>
<section><p id="message" role="status">Đang kiểm tra phiên local…</p></section>
<script>
const el=id=>document.getElementById(id), say=t=>el('message').textContent=t;
async function api(path,body){const r=await fetch('/admin/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error('API local không trả JSON: '+path)}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
async function refresh(){const d=await api('accounts');el('list').replaceChildren();for(const a of d.accounts||[]){const li=document.createElement('li');li.textContent=a.email||a.name||a.id;el('list').append(li)}say('Đã đọc danh sách tài khoản. Chưa kiểm thử model thật.')}
async function ready(){el('locked').hidden=true;el('accounts').hidden=false;const q=new URLSearchParams(location.search);if(location.pathname==='/auth/callback'&&q.has('code')&&q.has('state')){const flow=q.get('state');if(sessionStorage.getItem('oauth-completed')===flow){history.replaceState(null,'','/');return refresh()}say('Đang hoàn tất đăng nhập OpenAI…');await api('oauth/complete',{flowId:flow,input:location.href});sessionStorage.setItem('oauth-completed',flow);history.replaceState(null,'','/');say('Đã liên kết tài khoản.');}await refresh()}
el('unlock').onsubmit=async e=>{e.preventDefault();try{await api('session',{token:el('token').value});el('token').value='';await ready()}catch(x){say(x.message)}};
el('add').onsubmit=async e=>{e.preventDefault();try{el('authorize').hidden=true;const d=await api('oauth/start',{email:el('email').value,provider:'openai',method:'browser'});const u=new URL(d.authorizeUrl);if(u.origin!=='https://auth.openai.com')throw Error('Địa chỉ đăng nhập không đúng OpenAI');el('authorize').href=u.href;el('authorize').hidden=false;say('Bấm liên kết OpenAI phía trên, tự đăng nhập, rồi đợi trình duyệt quay về trang local.')}catch(x){say(x.message)}};
el('refresh').onclick=()=>refresh().catch(x=>say(x.message));
api('session').then(d=>d.authenticated?ready():say('Nhập admin token từ file local để mở trang.')).catch(x=>say(x.message));
</script></html>
